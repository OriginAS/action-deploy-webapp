name: 'Deploy webapp'
description: 'Deploys zipped webapp to a AWS EC2 server using SSH'
author: 'gskjold'
inputs:
  aws-role-arn:
    description: 'IAM role assumed through GitHub OIDC. The calling job needs `permissions: id-token: write`'
    required: false
    default: 'arn:aws:iam::835337142747:role/github-deploy'
  aws-access-key-id:
    description: 'Deprecated: only used when the calling job does not grant id-token: write'
    required: false
    default: ''
  aws-secret-access-key:
    description: 'Deprecated: see aws-access-key-id'
    required: false
    default: ''
  aws-security-group-id:
    description: 'The ID of the security group we should add access from this action to'
    required: true
  application-name:
    description: 'The name that the application should be install as on the server'
    required: true
  application-file:
    description: 'The .zip or .tar.gz file that is the packaged version of the project'
    required: true
  application-env:
    description: 'The .env file containing necessary environmental variables'
    required: false
    default: ''
  application-vhost:
    description: 'The vhost.conf file for apache virtual host'
    required: false
    default: ''
  application-web-root:
    description: 'The base path for the web root ex. /var/www'
    required: false
    default: ''
  server-host:
    description: 'Host name of the server to deploy to'
    required: true
  server-ssh-key:
    description: 'SSH private key that can access the server'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Get runner ip address
      id: ip
      shell: bash
      run: echo "ipv4=$(curl -4 -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT
    - name: Check for GitHub OIDC token
      id: oidc
      shell: bash
      run: echo "available=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo true || echo false)" >> $GITHUB_OUTPUT
    - name: Configure AWS credentials (OIDC)
      if: steps.oidc.outputs.available == 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        role-session-name: ${{ github.event.repository.name || 'github-actions' }}
        aws-region: eu-north-1
    - name: Configure AWS credentials (access key, deprecated)
      if: steps.oidc.outputs.available != 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: eu-north-1
    - shell: bash
      env:
        AWS_SG: ${{ inputs.aws-security-group-id }}
        RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
      run: |
        aws ec2 authorize-security-group-ingress \
          --group-id ${AWS_SG} \
          --protocol tcp \
          --port 22 \
          --cidr ${RUNNER_IP}/32

    - shell: bash
      env:
        SSH_KEY: ${{ inputs.server-ssh-key }}
        APP_FILE: ${{ inputs.application-file }}
        SERVER_HOST: ${{ inputs.server-host }}
        APP_NAME: ${{ inputs.application-name }}
        APP_ENV: ${{ inputs.application-env }}
        APP_VHOST: ${{ inputs.application-vhost }}
        APP_WEB_ROOT: ${{ inputs.application-web-root }}
      run: |
        echo "${SSH_KEY}" > private_key && chmod 600 private_key
        if [[ ${APP_FILE} == *.tar.gz ]];then
          scp -o StrictHostKeyChecking=no -i private_key ${APP_FILE} actions@${SERVER_HOST}:work/${APP_NAME}.tar.gz || exit 1
          DEPLOY_ARGS="-n ${APP_NAME} -a work/${APP_NAME}.tar.gz"
        elif [[ ${APP_FILE} == *.zip ]];then
          scp -o StrictHostKeyChecking=no -i private_key ${APP_FILE} actions@${SERVER_HOST}:work/${APP_NAME}.zip || exit 1
          DEPLOY_ARGS="-n ${APP_NAME} -a work/${APP_NAME}.zip"
        fi
        if [ -n "${APP_ENV}" ]; then
          scp -o StrictHostKeyChecking=no -i private_key ${APP_ENV} actions@${SERVER_HOST}:work/${APP_NAME}.env || exit 1
          DEPLOY_ARGS="$DEPLOY_ARGS -e work/${APP_NAME}.env"
        fi
        if [ -n "${APP_VHOST}" ]; then
          scp -o StrictHostKeyChecking=no -i private_key ${APP_VHOST} actions@${SERVER_HOST}:work/${APP_NAME}-vhost.conf || exit 1
          DEPLOY_ARGS="$DEPLOY_ARGS -v work/${APP_NAME}-vhost.conf"
        fi
        if [ -n "${APP_WEB_ROOT}" ]; then
          DEPLOY_ARGS="$DEPLOY_ARGS -w ${APP_WEB_ROOT}"
        fi
        ssh -o StrictHostKeyChecking=no -i private_key actions@${SERVER_HOST} "~/deploy-webapp-2025 $DEPLOY_ARGS" || exit 1
    - name: Revoke runner IP address
      if: always() && steps.ip.outputs.ipv4 != ''
      shell: bash
      env:
        AWS_SG: ${{ inputs.aws-security-group-id }}
        RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
      run: |
        aws ec2 revoke-security-group-ingress \
          --group-id ${AWS_SG} \
          --protocol tcp \
          --port 22 \
          --cidr ${RUNNER_IP}/32
