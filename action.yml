name: 'Deploy webapp'
description: 'Deploys zipped webapp to a AWS EC2 server using SSH'
author: 'gskjold'
inputs:
  aws-role-arn:
    description: 'IAM role assumed through GitHub OIDC. The calling job needs `permissions: id-token: write`'
    required: false
    default: 'arn:aws:iam::835337142747:role/github-deploy'
  aws-access-key-id:
    description: 'Deprecated: only used when the calling job does not grant id-token: write'
    required: false
    default: ''
  aws-secret-access-key:
    description: 'Deprecated: see aws-access-key-id'
    required: false
    default: ''
  aws-security-group-id:
    description: 'The ID of the security group we should add access from this action to'
    required: true
  application-name:
    description: 'The name that the application should be install as on the server'
    required: true
  application-file:
    description: 'The .zip or .tar.gz file that is the packaged version of the project'
    required: true
  application-env:
    description: 'The .env file containing necessary environmental variables'
    required: false
    default: ''
  application-vhost:
    description: 'The vhost.conf file for apache virtual host'
    required: false
    default: ''
  application-web-root:
    description: 'The base path for the web root ex. /var/www'
    required: false
    default: ''
  server-host:
    description: 'Host name of the server to deploy to'
    required: true
  server-ssh-key:
    description: 'SSH private key that can access the server'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Get runner ip address
      id: ip
      shell: bash
      run: echo "ipv4=$(curl -4 -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT
    - name: Check for GitHub OIDC token
      id: oidc
      shell: bash
      run: echo "available=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo true || echo false)" >> $GITHUB_OUTPUT
    - name: Configure AWS credentials (OIDC)
      if: steps.oidc.outputs.available == 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        role-session-name: ${{ github.event.repository.name || 'github-actions' }}
        aws-region: eu-north-1
    - name: Configure AWS credentials (access key, deprecated)
      if: steps.oidc.outputs.available != 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: eu-north-1
    - shell: bash
      run: |
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ inputs.aws-security-group-id }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

    - shell: bash
      run: |
        echo "${{ inputs.server-ssh-key }}" > private_key && chmod 600 private_key
        if [[ ${{ inputs.application-file }} == *.tar.gz ]];then
          scp -o StrictHostKeyChecking=no -i private_key ${{ inputs.application-file }} actions@${{ inputs.server-host }}:work/${{ inputs.application-name }}.tar.gz || exit 1
          DEPLOY_ARGS="-n ${{ inputs.application-name }} -a work/${{ inputs.application-name }}.tar.gz"
        elif [[ ${{ inputs.application-file }} == *.zip ]];then
          scp -o StrictHostKeyChecking=no -i private_key ${{ inputs.application-file }} actions@${{ inputs.server-host }}:work/${{ inputs.application-name }}.zip || exit 1
          DEPLOY_ARGS="-n ${{ inputs.application-name }} -a work/${{ inputs.application-name }}.zip"
        fi
        if [ -n "${{ inputs.application-env }}" ]; then
          scp -o StrictHostKeyChecking=no -i private_key ${{ inputs.application-env }} actions@${{ inputs.server-host }}:work/${{ inputs.application-name }}.env || exit 1
          DEPLOY_ARGS="$DEPLOY_ARGS -e work/${{ inputs.application-name }}.env"
        fi
        if [ -n "${{ inputs.application-vhost }}" ]; then
          scp -o StrictHostKeyChecking=no -i private_key ${{ inputs.application-vhost }} actions@${{ inputs.server-host }}:work/${{ inputs.application-name }}-vhost.conf || exit 1
          DEPLOY_ARGS="$DEPLOY_ARGS -v work/${{ inputs.application-name }}-vhost.conf"
        fi
        if [ -n "${{ inputs.application-web-root }}" ]; then
          DEPLOY_ARGS="$DEPLOY_ARGS -w ${{ inputs.application-web-root }}"
        fi
        ssh -o StrictHostKeyChecking=no -i private_key actions@${{ inputs.server-host }} "~/deploy-webapp-2025 $DEPLOY_ARGS" || exit 1
    - name: Revoke runner IP address
      if: always() && steps.ip.outputs.ipv4 != ''
      shell: bash
      run: |
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ inputs.aws-security-group-id }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32
